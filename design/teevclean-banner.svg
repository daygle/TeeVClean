<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">TeeVClean banner</title>
  <desc id="desc">A modern Android TV cleaning banner with the TeeVClean television mark and a lime clean-sweep checkmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C0F0C"/><stop offset=".6" stop-color="#101311"/><stop offset="1" stop-color="#141A12"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="30%" r="60%" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F35B" stop-opacity=".16"/><stop offset="1" stop-color="#B7F35B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1600" height="720" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="36" fill="url(#halo)"/>
  <circle cx="1240" cy="180" r="200" fill="#B7F35B" opacity=".07" filter="url(#soft)"/>

  <!-- App mark -->
  <g transform="translate(1000 130) scale(0.9)">
    <rect x="114" y="133" width="284" height="199" rx="47" fill="#1E2A1B"/>
    <rect x="138" y="156" width="236" height="152" rx="28" fill="#0E1510"/>
    <path d="M171 242 L218 289 L313 190" fill="none" stroke="#B7F35B" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M346 187 L353 202 L367 209 L353 215 L346 230 L339 215 L325 209 L339 202 Z" fill="#B7F35B"/>
    <path d="M232 332 H280 L285 360 H228 Z" fill="#1E2A1B"/>
    <rect x="175" y="360" width="162" height="24" rx="12" fill="#1E2A1B"/>
  </g>

  <!-- Copy -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="106" y="150" font-size="24" letter-spacing="7" fill="#B7F35B">TEEVCLEAN / ANDROID TV UTILITY</text>
    <text x="106" y="262" font-size="72" font-weight="700" fill="#FFFFFF">Make your TV</text>
    <text x="106" y="346" font-size="72" font-weight="700" fill="#FFFFFF">feel fast again.</text>
    <text x="110" y="412" font-size="27" fill="#9BA79C">Review storage. Clear cache safely. Keep moving.</text>
    <rect x="106" y="482" width="250" height="68" rx="16" fill="#B7F35B"/>
    <text x="146" y="526" font-size="25" font-weight="700" fill="#101311">REVIEW &amp; CLEAN</text>
  </g>
</svg>
