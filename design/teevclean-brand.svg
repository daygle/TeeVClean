<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TeeVClean launcher icon</title>
  <desc id="desc">A graphite television with an electric cyan scan beam, green sparkle, and clean signal.</desc>
  <defs>
    <linearGradient id="screen" x1="64" y1="58" x2="448" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182A36"/>
      <stop offset="1" stop-color="#0D171F"/>
    </linearGradient>
    <linearGradient id="beam" x1="100" y1="364" x2="394" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23D9E8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#23D9E8" stop-opacity=".78"/>
      <stop offset="1" stop-color="#8CFF72"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
