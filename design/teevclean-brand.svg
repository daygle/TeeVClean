  <path d="M94 355 400 101" stroke="url(#beam)" stroke-width="31" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M101 347 392 106" stroke="#BDFEFF" stroke-width="5" stroke-linecap="round" opacity=".92"/>
  <circle cx="394" cy="103" r="19" fill="#8CFF72" filter="url(#glow)"/>
  <path d="M394 66v74M357 103h74M368 77l52 52M420 77l-52 52" stroke="#F4FBFF" stroke-width="7" stroke-linecap="round"/>
  <g fill="#FFC857" opacity=".9">
    <circle cx="144" cy="265" r="7"/><circle cx="184" cy="297" r="5"/><circle cx="126" cy="311" r="4"/>
  </g>
