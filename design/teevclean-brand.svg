<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TeeVClean launcher icon</title>
  <desc id="desc">A dark television whose screen shows a lime clean-sweep checkmark and a sparkle.</desc>
  <defs>
    <radialGradient id="glow" cx="72%" cy="14%" r="80%" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7F35B" stop-opacity=".14"/>
      <stop offset="1" stop-color="#B7F35B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ink tile -->
  <rect width="512" height="512" rx="116" fill="#101311"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- TV frame -->
  <rect x="114" y="133" width="284" height="199" rx="47" fill="#1E2A1B"/>
  <!-- Screen -->
  <rect x="138" y="156" width="236" height="152" rx="28" fill="#0E1510"/>

  <!-- Clean-sweep checkmark -->
  <path d="M171 242 L218 289 L313 190" fill="none" stroke="#B7F35B" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkle -->
  <path d="M346 187 L353 202 L367 209 L353 215 L346 230 L339 215 L325 209 L339 202 Z" fill="#B7F35B"/>

  <!-- Stand -->
  <path d="M232 332 H280 L285 360 H228 Z" fill="#1E2A1B"/>
  <rect x="175" y="360" width="162" height="24" rx="12" fill="#1E2A1B"/>
</svg>
