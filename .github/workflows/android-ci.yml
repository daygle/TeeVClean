name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress; pushes to main always
# finish so every commit there keeps a result.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '21'
        distribution: 'temurin'

    # Caches Gradle state between runs (written from main, read by pull requests) and verifies
    # gradle-wrapper.jar against Gradle's published checksums before anything runs it.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    # The same checks the release workflow gates on (release lint, no Gradle warnings), so a
    # problem shows up on the pull request rather than when a version is tagged.
    - name: Build, test and lint
      run: ./gradlew assembleDebug testDebugUnitTest lintDebug lintRelease --warning-mode=fail --console=plain

    - name: Upload Debug APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: TeeVClean-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Build Reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: TeeVClean-Reports
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-release.html
          app/build/reports/tests/testDebugUnitTest/
        if-no-files-found: ignore
        retention-days: 14
