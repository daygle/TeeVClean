name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Never cancel a release mid-publish; queue a re-pushed tag behind the running one.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build AAB and publish to GitHub Releases
    # Pinned like Android CI, so a runner image change can't alter a release unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper
          add-job-summary: always

      # Sets up the Android SDK environment. AGP auto-provisions the platform/build-tools
      # it needs, but the action's default 'packages' input ('tools platform-tools') fails
      # because the obsolete 'tools' package is gone from Google's SDK repository.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # versionCode must increase with every release, so it is derived from the tag rather than
      # the run number: MAJOR*10^8 + MINOR*10^5 + PATCH*10^2 + STAGE. STAGE puts pre-releases
      # below their final release, in SemVer order, so a beta uploaded to Play never blocks the
      # final: alpha.N = N, beta.N = 33+N, rc.N = 66+N (N from 0 to 32), final = 99.
      # v1.0.0 -> 100000099, v1.1.0-beta.2 -> 100100035. Every code is above the earlier scheme's
      # (v1.0.0 was 1000000), so updates over a release made with it still install.
      - name: Extract version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)(\.([0-9]+))?)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH, optionally followed by -alpha.N, -beta.N or -rc.N"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]})); MINOR=$((10#${BASH_REMATCH[2]})); PATCH=$((10#${BASH_REMATCH[3]}))
          LABEL="${BASH_REMATCH[5]}"; NUMBER=$((10#${BASH_REMATCH[7]:-0}))
          if (( MAJOR > 20 || MINOR > 999 || PATCH > 999 || NUMBER > 32 )); then
            echo "::error::Version $VERSION does not fit the versionCode scheme (MAJOR<=20, MINOR<=999, PATCH<=999, pre-release number<=32)"
            exit 1
          fi
          case "$LABEL" in
            alpha) STAGE=$NUMBER ;;
            beta) STAGE=$((33 + NUMBER)) ;;
            rc) STAGE=$((66 + NUMBER)) ;;
            *) STAGE=99 ;;
          esac
          VERSION_CODE=$(( MAJOR * 100000000 + MINOR * 100000 + PATCH * 100 + STAGE ))
          PRERELEASE=false
          [[ -n "$LABEL" ]] && PRERELEASE=true
          {
            echo "VERSION_NAME=$VERSION"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "PRERELEASE=$PRERELEASE"
          } >> "$GITHUB_ENV"
          echo "Releasing version $VERSION (versionCode $VERSION_CODE, prerelease $PRERELEASE)"

      # Lint gates the release, so no lint error reaches Play.
      - name: Lint
        run: ./gradlew lintRelease --warning-mode=fail --stacktrace

      # Releases are a signed App Bundle only; an unsigned bundle cannot be uploaded to
      # Play, so missing signing secrets fail the release instead of producing one.
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "::error::Repository secret RELEASE_KEYSTORE_B64 is not set (see RELEASING.md 'Release signing')."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests and signed release bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest bundleRelease --warning-mode=fail --stacktrace

      # Fail loudly rather than publishing an unsigned bundle.
      - name: Verify bundle signature and name it after the version
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "::error::No bundle at $AAB."
            ls -l app/build/outputs/bundle/release/ || true
            exit 1
          fi
          OUT=$(jarsigner -verify "$AAB")
          # Compare in the shell instead of piping through `grep -q`: grep exits on its first
          # match, so the producer dies with a "Broken pipe" write error in the log.
          if [[ "$OUT" != *"jar verified"* ]]; then
            echo "$OUT"
            echo "::error::$AAB is not signed."
            exit 1
          fi
          mv "$AAB" "app/build/outputs/bundle/release/TeeVClean-$VERSION_NAME-release.aab"

      # archive: false uploads the .aab as-is instead of wrapping it in a zip.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: app/build/outputs/bundle/release/TeeVClean-${{ env.VERSION_NAME }}-release.aab
          archive: false
          if-no-files-found: error
          retention-days: 14

      # The mapping file is embedded in the .aab for Play; keep a copy so stack traces
      # can also be retraced locally.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeeVClean-debug-files-${{ env.VERSION_NAME }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      # Upstream action bug (softprops/action-gh-release#827): when a release for the tag
      # already exists (a re-run or a re-fired build), the action PATCHes it again with
      # generate_release_notes: true, and GitHub merges the fresh notes into the old body
      # instead of replacing it - duplicated "What's Changed" sections. Clearing the body
      # first makes the regeneration start clean. Idempotent: a first build is untouched.
      - name: Clear stale release body on re-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes ""
            echo "::notice::Release $TAG already existed (re-run/re-fired build); cleared its body so notes regenerate without duplication."
          else
            echo "No existing release for $TAG; creating fresh."
          fi

      - name: Create GitHub Release and upload AAB
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.PRERELEASE }}
